<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      --bg: #f4f1ee;
      --panel: #ffffff;
      --text: #1c1b1a;
      --muted: #7a746f;
      --key: #ebe7e3;
      --key-text: #1c1b1a;
      --accent: #8d153a;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161413;
        --panel: #221f1e;
        --text: #f3efec;
        --muted: #a39c97;
        --key: #332f2d;
        --key-text: #f3efec;
        --accent: #c2305c;
        --accent-text: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .calc {
      width: min(92vw, 360px);
      padding: 16px;
      background: var(--panel);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .screen {
      min-height: 96px;
      padding: 8px 12px 16px;
      text-align: right;
      overflow: hidden;
    }
    .history {
      min-height: 22px;
      font-size: 1rem;
      color: var(--muted);
    }
    .display {
      font-size: 2.6rem;
      font-weight: 600;
      line-height: 1.2;
      word-break: break-all;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 64px;
      border: 0;
      border-radius: 16px;
      background: var(--key);
      color: var(--key-text);
      font-size: 1.4rem;
      font-family: inherit;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button.op, button.equals { background: var(--accent); color: var(--accent-text); }
    button.op.active { outline: 3px solid var(--text); outline-offset: -3px; }
  </style>
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="screen">
      <div class="history" id="history" aria-hidden="true"></div>
      <div class="display" id="display" role="status" aria-live="polite">0</div>
    </div>
    <div class="keys" id="keys">
      <button data-action="clear" aria-label="Clear all">AC</button>
      <button data-action="backspace" aria-label="Delete last digit">&#9003;</button>
      <button data-action="percent" aria-label="Percent">%</button>
      <button class="op" data-action="op" data-value="÷" aria-label="Divide">÷</button>

      <button data-action="digit" data-value="7">7</button>
      <button data-action="digit" data-value="8">8</button>
      <button data-action="digit" data-value="9">9</button>
      <button class="op" data-action="op" data-value="×" aria-label="Multiply">×</button>

      <button data-action="digit" data-value="4">4</button>
      <button data-action="digit" data-value="5">5</button>
      <button data-action="digit" data-value="6">6</button>
      <button class="op" data-action="op" data-value="−" aria-label="Subtract">−</button>

      <button data-action="digit" data-value="1">1</button>
      <button data-action="digit" data-value="2">2</button>
      <button data-action="digit" data-value="3">3</button>
      <button class="op" data-action="op" data-value="+" aria-label="Add">+</button>

      <button data-action="negate" aria-label="Change sign">±</button>
      <button data-action="digit" data-value="0">0</button>
      <button data-action="dot" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const displayEl = document.getElementById('display');
    const historyEl = document.getElementById('history');
    const keysEl = document.getElementById('keys');

    let current = '0';        // the number being typed (as text)
    let previous = null;      // the first number of a pending calculation
    let op = null;            // the pending operator: + − × ÷
    let awaiting = false;     // true right after an operator is pressed
    let justEvaluated = false; // true right after = is pressed

    function clean(n) {
      // Avoids results like 0.30000000000000004
      return Number.isFinite(n) ? String(parseFloat(n.toPrecision(12))) : 'Error';
    }

    function compute(a, b, operator) {
      switch (operator) {
        case '+': return a + b;
        case '−': return a - b;
        case '×': return a * b;
        case '÷': return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function updateDisplay() {
      displayEl.textContent = current;
      historyEl.textContent = (previous !== null && op) ? clean(previous) + ' ' + op : '';
      document.querySelectorAll('button.op').forEach(function (btn) {
        btn.classList.toggle('active', awaiting && btn.dataset.value === op);
      });
    }

    function clearAll() {
      current = '0';
      previous = null;
      op = null;
      awaiting = false;
      justEvaluated = false;
    }

    function startFresh() {
      // After "=" or an error, typing a number starts a new calculation.
      if (current === 'Error' || justEvaluated) {
        clearAll();
      }
    }

    function inputDigit(d) {
      startFresh();
      if (awaiting) {
        current = d;
        awaiting = false;
      } else if (current === '0') {
        current = d;
      } else if (current.replace(/[-.]/g, '').length < 15) {
        current += d;
      }
    }

    function inputDot() {
      startFresh();
      if (awaiting) {
        current = '0.';
        awaiting = false;
      } else if (!current.includes('.')) {
        current += '.';
      }
    }

    function chooseOp(next) {
      if (current === 'Error') return;
      justEvaluated = false;
      if (op && awaiting) {
        op = next; // user changed their mind about the operator
        return;
      }
      if (op && previous !== null) {
        const result = clean(compute(previous, parseFloat(current), op));
        if (result === 'Error') {
          clearAll();
          current = 'Error';
          return;
        }
        current = result;
      }
      previous = parseFloat(current);
      op = next;
      awaiting = true;
    }

    function equals() {
      if (current === 'Error' || op === null || awaiting) return;
      const result = clean(compute(previous, parseFloat(current), op));
      previous = null;
      op = null;
      awaiting = false;
      current = result;
      justEvaluated = true;
    }

    function backspace() {
      if (current === 'Error' || justEvaluated || awaiting) return;
      current = current.slice(0, -1);
      if (current === '' || current === '-') current = '0';
    }

    function percent() {
      if (current === 'Error') return;
      current = clean(parseFloat(current) / 100);
      awaiting = false;
    }

    function negate() {
      if (current === 'Error' || current === '0') return;
      current = current.startsWith('-') ? current.slice(1) : '-' + current;
    }

    function handle(action, value) {
      switch (action) {
        case 'digit': inputDigit(value); break;
        case 'dot': inputDot(); break;
        case 'op': chooseOp(value); break;
        case 'equals': equals(); break;
        case 'clear': clearAll(); break;
        case 'backspace': backspace(); break;
        case 'percent': percent(); break;
        case 'negate': negate(); break;
      }
      updateDisplay();
    }

    keysEl.addEventListener('click', function (event) {
      const btn = event.target.closest('button');
      if (btn) handle(btn.dataset.action, btn.dataset.value);
    });

    const keyMap = { '*': '×', '/': '÷', '-': '−', '+': '+' };
    document.addEventListener('keydown', function (event) {
      const k = event.key;
      if (k >= '0' && k <= '9') handle('digit', k);
      else if (k === '.') handle('dot');
      else if (k in keyMap) { event.preventDefault(); handle('op', keyMap[k]); }
      else if (k === 'Enter' || k === '=') { event.preventDefault(); handle('equals'); }
      else if (k === 'Backspace') handle('backspace');
      else if (k === 'Escape') handle('clear');
      else if (k === '%') handle('percent');
    });

    updateDisplay();
  </script>
</body>
</html>
